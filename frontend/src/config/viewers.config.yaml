# Fileglancer OME-Zarr Viewers Configuration
#
# This is the default bundled into the build. To customize, copy this file
# outside frontend/ and set FGC_VIEWERS_CONFIG=/path/to/copy (or
# viewers_config in config.yaml) to override viewers at runtime without
# rebuilding. See docs/ViewersConfiguration.md for details.
#
# Each viewer entry requires:
#   - manifest_url: URL or absolute path to a capability manifest YAML file
#     Use absolute paths (e.g. /viewers/neuroglancer.yaml) for manifests bundled
#     in the public/ directory, or full URLs for externally hosted manifests.
#
# Optional:
#   - instance_template_url: Override the viewer's template_url from the manifest
#   - label: Custom tooltip text (defaults to "View in {Name}")

viewers:
  - manifest_url: 'https://raw.githubusercontent.com/BioImageTools/capability-manifest/main/manifests/neuroglancer.yaml'

  - manifest_url: 'https://raw.githubusercontent.com/BioImageTools/capability-manifest/main/manifests/avivator.yaml'

  - manifest_url: 'https://raw.githubusercontent.com/BioImageTools/capability-manifest/main/manifests/validator.yaml'

  - manifest_url: 'https://raw.githubusercontent.com/BioImageTools/capability-manifest/main/manifests/vole.yaml'
